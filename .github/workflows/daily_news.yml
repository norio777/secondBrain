name: Daily News Fetcher

on:
  schedule:
    # 毎日 日本時間 07:00 (UTC 前日22:00) に実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行用（テストに便利です）

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout secondBrain
        uses: actions/checkout@v4
        with:
          # 別リポジトリの場合は repository: 'ユーザー名/secondBrain' と token: ${{ secrets.GH_PAT }} を指定
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install google-genai requests beautifulsoup4

      - name: Run Fetch and Gemini Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 変更がある場合のみコミットしてプッシュ
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: auto-update daily news $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
